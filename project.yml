name: DBooyvol
options:
  bundleIdPrefix: silver
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: ru
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Personal Team (free Apple ID). A stable signature keeps the Keychain
    # master-key item accessible across rebuilds.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VWLZA3FPJX
    ENABLE_HARDENED_RUNTIME: NO

targets:
  DBooyvol:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        # Changing this changes the UserDefaults domain, so AppSettings
        # migrates the settings from the previous identifier on first launch.
        PRODUCT_BUNDLE_IDENTIFIER: silver.dbooyvol
        PRODUCT_NAME: DBooyvol
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "1.0.122"
        CURRENT_PROJECT_VERSION: "122"
      configs:
        Release:
          # No debugger entitlement in the build that holds the Keychain key.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Info.plist
      properties:
        CFBundleName: DBooyvol
        CFBundleDisplayName: DBooyvol
        CFBundleIconFile: AppIcon
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations:
          - en
          - es
          - pt
          - fr
          - de
          - it
          - nl
          - pl
          - tr
          - ru
          - uk
          - ar
          - hi
          - zh-Hans
          - zh-Hant
          - ja
          - ko
          - id
          - vi
          - th
          - sv
          - cs
        CFBundleShortVersionString: "1.0.122"
        CFBundleVersion: "122"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
